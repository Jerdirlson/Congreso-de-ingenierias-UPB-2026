services:

  # ── Nginx: sirve el frontend compilado y hace proxy al backend ────────────
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    container_name: cgr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Bind mount al host (read-only) — Nginx sirve archivos directamente
      - ./data/storage/app/public:/var/www/html/storage/app/public:ro
      # Certificados SSL del CTIC
      - /etc/ssh/congreso:/etc/ssl/congreso:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cgr-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PHP-FPM (Laravel backend) ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cgr-backend
    volumes:
      - ./backend:/var/www/html
      - cgr-vendor:/var/www/html/vendor
      # Bind mount al host → archivos accesibles y fáciles de respaldar
      - ./data/storage:/var/www/html/storage
      # PHP ini y pool de workers
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/app.ini:ro
      - ./docker/php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-app.conf:ro
    environment:
      APP_ENV:    production
      APP_DEBUG:  "false"
      APP_URL:    ${APP_URL:-https://congreso2026.bucaramanga.upb.edu.co}
      APP_KEY:    ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST:    mysql
      DB_PORT:    "3306"
      DB_DATABASE: ${DB_DATABASE:-congreso_db}
      DB_USERNAME: ${DB_USERNAME:-congreso}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST:     redis
      REDIS_PORT:     "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_DRIVER:      redis
      SESSION_DRIVER:    redis
      QUEUE_CONNECTION:  redis
      FILESYSTEM_DISK:   public
      LOG_CHANNEL:       stderr
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-congreso2026.bucaramanga.upb.edu.co}
      # Habilita /api/dev/* para pruebas. Quitar cuando no se necesite.
      ALLOW_UPLOAD_TEST: ${ALLOW_UPLOAD_TEST:-false}
      # Correo (verificación de registro)
      MAIL_MAILER:        ${MAIL_MAILER:-smtp}
      MAIL_HOST:          ${MAIL_HOST}
      MAIL_PORT:          ${MAIL_PORT:-587}
      MAIL_USERNAME:      ${MAIL_USERNAME}
      MAIL_PASSWORD:      ${MAIL_PASSWORD}
      MAIL_ENCRYPTION:    ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS:  ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME:     ${MAIL_FROM_NAME:-"Congreso Ingenierías 2026"}
      # Cloudflare Stream
      CLOUDFLARE_ACCOUNT_ID:              ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN:               ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_STREAM_WEBHOOK_SECRET:   ${CLOUDFLARE_STREAM_WEBHOOK_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cgr-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"


  # ── Queue worker (procesa videos y otros jobs) ────────────────────────────
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cgr-queue-worker
    command: ['php', 'artisan', 'queue:work', 'redis', '--sleep=3', '--tries=2', '--timeout=300', '--max-time=3600']
    volumes:
      - ./backend:/var/www/html
      - cgr-vendor:/var/www/html/vendor
      - ./data/storage:/var/www/html/storage
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/app.ini:ro
    environment:
      APP_ENV:          production
      APP_DEBUG:        "false"
      APP_URL:          ${APP_URL:-https://congreso2026.bucaramanga.upb.edu.co}
      APP_KEY:          ${APP_KEY}
      DB_CONNECTION:    mysql
      DB_HOST:          mysql
      DB_PORT:          "3306"
      DB_DATABASE:      ${DB_DATABASE:-congreso_db}
      DB_USERNAME:      ${DB_USERNAME:-congreso}
      DB_PASSWORD:      ${DB_PASSWORD}
      REDIS_HOST:       redis
      REDIS_PORT:       "6379"
      REDIS_PASSWORD:   ${REDIS_PASSWORD}
      CACHE_DRIVER:     redis
      SESSION_DRIVER:   redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL:      stderr
      MAIL_MAILER:        ${MAIL_MAILER:-smtp}
      MAIL_HOST:          ${MAIL_HOST}
      MAIL_PORT:          ${MAIL_PORT:-587}
      MAIL_USERNAME:      ${MAIL_USERNAME}
      MAIL_PASSWORD:      ${MAIL_PASSWORD}
      MAIL_ENCRYPTION:    ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS:  ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME:     ${MAIL_FROM_NAME:-"Congreso Ingenierías 2026"}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cgr-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── MySQL 8.0 ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: cgr-mysql
    # Puerto NO expuesto al host en producción (solo accesible internamente)
    environment:
      MYSQL_DATABASE:      ${DB_DATABASE:-congreso_db}
      MYSQL_USER:          ${DB_USERNAME:-congreso}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Bind mount → mysqldump / rsync funciona directo sobre ./data/mysql
      - ./data/mysql:/var/lib/mysql
      # Tuning de rendimiento para 300 usuarios concurrentes
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - cgr-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cgr-redis
    # Puerto NO expuesto al host en producción
    # Arranca con contraseña + límite de memoria + política de evicción LRU
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 100
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cgr-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Uptime Kuma — monitoreo y alertas de disponibilidad ─────────────────
  # Acceder en: http://207.248.81.83:3001 (requiere: sudo ufw allow 3001/tcp)
  # Configurar notificaciones (email/Telegram/Slack) desde la UI al primer acceso
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: cgr-uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    restart: unless-stopped
    networks:
      - cgr-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  # Solo vendor queda como named volume (se rellena durante el build)
  # mysql, redis, storage y uptime-kuma usan bind mounts en ./data/ → respaldar con rsync
  cgr-vendor:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  cgr-network:
    driver: bridge
