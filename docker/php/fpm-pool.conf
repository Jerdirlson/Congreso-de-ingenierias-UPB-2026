; ══════════════════════════════════════════════════════════════════════════════
;  PHP-FPM pool — tuning para ~300 usuarios concurrentes
;  VPS 4 GB RAM: ~2 GB disponibles para PHP workers
;  Cada worker Laravel típico: 80-100 MB → max 20 workers seguros
; ══════════════════════════════════════════════════════════════════════════════

[www]
; Gestión dinámica: escala hacia arriba bajo carga y libera cuando baja
pm                   = dynamic

; Máximo de procesos worker simultáneos
; Fórmula: RAM_disponible_PHP / RAM_por_worker = ~2000MB / 100MB = 20
pm.max_children      = 20

; Workers al arrancar
pm.start_servers     = 5

; Mínimo de workers en espera (evita latencia en picos repentinos)
pm.min_spare_servers = 3

; Máximo de workers en espera (evita consumo innecesario)
pm.max_spare_servers = 8

; Reciclar workers tras N peticiones (previene memory leaks de largo plazo)
pm.max_requests      = 500

; Log de peticiones lentas → stderr del contenedor (visible con docker logs)
slowlog                 = /proc/self/fd/2
request_slowlog_timeout = 5s
