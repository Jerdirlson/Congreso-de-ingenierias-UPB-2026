server_tokens off;

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# ── HTTP → redirige a HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    server_name congreso2026.bucaramanga.upb.edu.co 207.248.81.83;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name congreso2026.bucaramanga.upb.edu.co 207.248.81.83;

    ssl_certificate     /etc/ssl/congreso/fullchain.pem;
    ssl_certificate_key /etc/ssl/congreso/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    charset utf-8;

    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header X-XSS-Protection       "1; mode=block"                    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2100M;
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|sanctum)/ {
        limit_req zone=api burst=60 nodelay;

        fastcgi_pass   backend:9000;

        fastcgi_param  SCRIPT_FILENAME  /var/www/html/public/index.php;
        fastcgi_param  DOCUMENT_ROOT    /var/www/html/public;
        fastcgi_param  REQUEST_URI      $request_uri;
        fastcgi_param  QUERY_STRING     $query_string;
        fastcgi_param  REQUEST_METHOD   $request_method;
        fastcgi_param  CONTENT_TYPE     $content_type;
        fastcgi_param  CONTENT_LENGTH   $content_length;
        fastcgi_param  SERVER_NAME      $server_name;
        fastcgi_param  HTTPS            on;

        include        fastcgi_params;
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_buffer_size  64k;
        fastcgi_buffers      4 64k;
    }

    location /storage/ {
        alias   /var/www/html/storage/app/public/;
        try_files $uri =404;

        add_header Accept-Ranges bytes;

        location ~* \.(mp4|webm|mov|avi|mkv|m4v)$ {
            add_header Accept-Ranges   bytes;
            add_header Cache-Control   "public, max-age=3600";
            mp4;
            mp4_buffer_size     1m;
            mp4_max_buffer_size 5m;
        }

        location ~* \.(pdf|docx|pptx|xlsx|zip|doc|ppt)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_log  /var/log/nginx/cgr-error.log;
    access_log /var/log/nginx/cgr-access.log;
}
