# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name congreso2026.bucaramanga.upb.edu.co;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name congreso2026.bucaramanga.upb.edu.co;
    root /var/www/html/public;
    index index.php index.html;

    # ── SSL ────────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/congreso/fullchain.pem;
    ssl_certificate_key /etc/ssl/congreso/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Límite de subida (dev = mismo que prod para poder probar videos grandes)
    client_max_body_size 2100M;

    # Eficiencia para transferencias grandes
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # ── Main location ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   backend:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
    }

    # ── Block .htaccess ───────────────────────────────────────────────────────
    location ~ /\.ht {
        deny all;
    }

    # ── Media/storage files ───────────────────────────────────────────────────
    location /storage {
        alias /var/www/html/storage/app/public;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    error_log  /var/log/nginx/cgr-error.log;
    access_log /var/log/nginx/cgr-access.log;
}
