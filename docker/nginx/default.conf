# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name congreso2026.bucaramanga.upb.edu.co;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name congreso2026.bucaramanga.upb.edu.co;

    # ── SSL ────────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/congreso/fullchain.pem;
    ssl_certificate_key /etc/ssl/congreso/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # ── Storage/media files ────────────────────────────────────────────────────
    location /storage {
        alias /var/www/html/storage/app/public;
    }

    # ── API y sanctum → Laravel/PHP-FPM ───────────────────────────────────────
    location ~ ^/(api|sanctum) {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass   backend:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
    }

    # ── Frontend Vue/Vite ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_log  /var/log/nginx/cgr-error.log;
    access_log /var/log/nginx/cgr-access.log;
}
