name: CI/CD — Congreso Ingenierías 2026

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Tests del backend (Laravel + SQLite en memoria) ──────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, zip, gd, bcmath
          coverage: none

      - name: Cache de dependencias Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias PHP
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar entorno de tests
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar tests
        working-directory: backend
        run: php artisan test --stop-on-failure

  # ── 2. Validar configuración de Nginx ───────────────────────────────────────
  validate-nginx:
    name: Validate Nginx Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Validar nginx.prod.conf
        run: sh docker/nginx/validate.sh

  # ── 3. Deploy al VPS (solo push a main, solo si los tests pasan) ────────────
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    needs: [test-backend, validate-nginx]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Actualizar código
        run: |
          git -C ~/congreso fetch origin main
          sudo chown -R $(whoami):$(whoami) ~/congreso/backend/bootstrap/cache/ ~/congreso/backend/storage/ || true
          git -C ~/congreso clean -fd -e data/ -e .env -e docker-compose.prod.yml
          git -C ~/congreso reset --hard origin/main

      - name: Reconstruir y reiniciar servicios
        run: docker compose -f ~/congreso/docker-compose.prod.yml up --build -d

      - name: Correr migraciones
        run: |
          sleep 15
          docker compose -f ~/congreso/docker-compose.prod.yml exec -T backend php artisan migrate --force

      - name: Verificar despliegue
        run: docker compose -f ~/congreso/docker-compose.prod.yml ps

      - name: Health check — esperar que el backend responda
        run: |
          echo "⏳ Esperando que el backend esté listo..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ]; then
              echo "✅ Backend responde OK (HTTP $STATUS)"
              exit 0
            fi
            echo "   intento $i/20 — HTTP $STATUS, reintentando en 5s..."
            sleep 5
          done
          echo "❌ El backend no respondió después de 100s"
          docker compose -f ~/congreso/docker-compose.prod.yml logs --tail=30 nginx
          docker compose -f ~/congreso/docker-compose.prod.yml logs --tail=30 backend
          exit 1
